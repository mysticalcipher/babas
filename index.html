<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黔岭985领航工作室 - 个人展示</title>
    <style>
        /* --- 全局：参考“未来界面蓝”配色 --- */
        :root {
            --bg-main: #F4F7FF;       
            --primary-blue: #5F86FF;  
            --light-blue: #A9C2FF;    
            --text-dark: #2F3E66;     
            --text-light: #7A8BA8;    
            --white: #FFFFFF;
            --shadow-soft: rgba(95, 134, 255, 0.08);
            --shadow-glow: rgba(95, 134, 255, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }

        body {
            background: linear-gradient(180deg, #F4F7FF 0%, #EBF0FA 100%);
            min-height: 100vh;
            color: var(--text-dark);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }

        /* --- 顶部人物卡片 --- */
        .hero { padding: 50px 0 20px; }

        .hero-content {
            background: var(--white);
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 40px var(--shadow-soft);
            border: 1px solid rgba(169, 194, 255, 0.3);
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .hero-content.show { opacity: 1; transform: translateY(0); }

        .avatar-box {
            width: 150px; height: 150px;
            margin: 0 auto 25px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary-blue), var(--light-blue));
            box-shadow: 0 10px 25px var(--shadow-glow);
        }

        .avatar-box img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;
        }

        .hero-title {
            font-size: 2rem; color: var(--text-dark); font-weight: 800; letter-spacing: 2px; margin-bottom: 10px;
        }

        .hero-sub { font-size: 1.05rem; color: var(--text-light); margin-bottom: 35px; font-weight: 500;}

        /* --- 核心数据柱状图区 --- */
        .stats-section {
            margin-top: 20px;
            padding-top: 25px;
            border-top: 1px dashed rgba(95, 134, 255, 0.2);
        }
        .stats-title {
            font-size: 1rem; color: var(--text-light); margin-bottom: 20px; letter-spacing: 1px;
        }
        
        .chart-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 180px;
            padding: 0 10px;
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 30%;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            max-width: 46px;
            height: 0; 
            background: linear-gradient(to top, var(--light-blue), var(--primary-blue));
            border-radius: 8px 8px 0 0;
            box-shadow: 0 5px 15px rgba(95, 134, 255, 0.2);
            transition: height 1.5s cubic-bezier(0.16, 1, 0.3, 1); 
            position: relative;
        }
        .bar::after {
            content: ''; position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
            width: 12px; height: 4px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-blue);
        }

        .bar-num {
            font-size: 1.3rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 6px;
            opacity: 0; 
            transition: opacity 1s ease 0.6s; 
        }
        .bar-num.show { opacity: 1; }

        .bar-label {
            font-size: 0.8rem; color: var(--text-light); margin-top: 10px; text-align: center;
            line-height: 1.2; font-weight: 500;
        }

        /* --- 核心优势卡片 --- */
        .features-section { padding: 30px 0 20px; }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .feature-card {
            background: var(--white);
            border: 1px solid rgba(169, 194, 255, 0.4);
            padding: 25px 15px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 20px var(--shadow-soft);
            transition: all 0.4s ease;
        }
        .feature-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-blue);
            box-shadow: 0 15px 30px var(--shadow-glow);
        }
        .feature-icon {
            font-size: 1.6rem; margin-bottom: 10px; display: inline-block;
            color: var(--primary-blue);
        }
        .feature-title { font-size: 1rem; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .feature-desc { font-size: 0.85rem; color: var(--text-light); }

        /* --- 精英培养与突破模块 --- */
        .service-section { padding: 20px 0 10px; }
        .service-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .service-card {
            background: var(--white);
            border-left: 5px solid var(--primary-blue);
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 8px 20px var(--shadow-soft);
            display: flex;
            align-items: flex-start;
            gap: 15px;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(40px);
        }
        .service-card.show { opacity: 1; transform: translateY(0); }
        .service-card:hover { transform: translateX(5px); box-shadow: 0 10px 25px var(--shadow-glow); }
        .service-icon {
            font-size: 1.8rem; background: rgba(95, 134, 255, 0.1);
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; flex-shrink: 0;
        }
        .service-content h4 { font-size: 1.05rem; color: var(--text-dark); margin-bottom: 5px; font-weight: 700; }
        .service-content p { font-size: 0.9rem; color: var(--text-light); }
        .service-highlight { color: var(--primary-blue); font-weight: 700; }

        /* --- 视频展示区 --- */
        .video-section { padding: 30px 0 60px; }
        .section-title {
            text-align: center; font-size: 1.6rem; color: var(--text-dark); margin-bottom: 35px;
            position: relative; font-weight: 700;
        }
        .section-title::after {
            content: ''; display: block; width: 40px; height: 4px;
            background: var(--primary-blue); margin: 12px auto 0; border-radius: 2px;
            box-shadow: 0 2px 8px var(--shadow-glow);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--white);
            border: 1px solid rgba(169, 194, 255, 0.4);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px var(--shadow-soft);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease, box-shadow 0.4s ease;
            opacity: 0;
            transform: translateY(50px); 
            cursor: pointer; /* 鼠标放上去变成小手，表示可以点击 */
        }

        .video-card.show { opacity: 1; transform: translateY(0); }
        .video-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px var(--shadow-glow);
            border-color: var(--primary-blue); /* 悬浮时边框变蓝 */
        }

        /* 跳转按钮的样式 */
        .video-placeholder {
            width: 100%; aspect-ratio: 16 / 9;
            background: #EEF3FB;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--primary-blue); 
            border-bottom: 1px solid rgba(169, 194, 255, 0.3);
            transition: background 0.3s;
        }
        .video-card:hover .video-placeholder { background: #E2EBFA; }

        .play-icon {
            font-size: 36px; color: var(--primary-blue); margin-bottom: 8px;
            transition: transform 0.3s;
            background: rgba(95, 134, 255, 0.1); width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            padding-left: 5px; /* 视觉居中微调 */
        }
        .video-card:hover .play-icon { transform: scale(1.1); background: rgba(95, 134, 255, 0.2); }

        .video-info { padding: 20px; }
        .video-info h3 { font-size: 1.05rem; color: var(--text-dark); margin-bottom: 6px; }
        .video-info p { font-size: 0.85rem; color: var(--text-light); }

        /* --- 底部 --- */
        footer {
            background: var(--white); color: var(--text-light); text-align: center;
            padding: 30px 0; margin-top: 40px; font-size: 0.85rem;
            border-top: 1px solid rgba(169, 194, 255, 0.3);
            box-shadow: 0 -5px 20px rgba(95, 134, 255, 0.03);
        }

        /* --- 手机端适配 --- */
        @media (max-width: 768px) {
            .hero-content { padding: 30px 20px; }
            .hero-title { font-size: 1.7rem; }
            .chart-container { height: 150px; }
            .bar-num { font-size: 1.15rem; }
            .feature-grid { grid-template-columns: 1fr; gap: 12px; }
            .video-grid { grid-template-columns: 1fr; }
            .service-card { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部人物卡片 -->
        <section class="hero">
            <div class="hero-content" id="heroCard">
                <div class="avatar-box">
                    <img src="avatar.jpg" alt="黔岭985领航工作室创始人">
                </div>
                <h1 class="hero-title">黔岭985领航工作室</h1>
                <p class="hero-sub">企业、教育集团策划 | 30年教育教学经验</p>
                
                <!-- 动态柱状图区 -->
                <div class="stats-section">
                    <div class="stats-title">核心战绩数据</div>
                    <div class="chart-container" id="chartContainer"></div>
                </div>
            </div>
        </section>

        <!-- 核心优势区 -->
        <section class="features-section">
            <div class="feature-grid" id="featureGrid"></div>
        </section>

        <!-- 精英培养与突破区 -->
        <section class="service-section">
            <div class="service-grid" id="serviceGrid"></div>
        </section>

        <!-- 视频展示区 -->
        <section class="video-section">
            <h2 class="section-title">教学成果与分享</h2>
            <div class="video-grid" id="videoGrid"></div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 黔岭985领航工作室 | 专注教育，领航未来</p>
    </footer>

    <script>
        // ============================================================
        // 数据配置区（你只需要改这里）
        // ============================================================
        
        // 1. 柱状图数据
        const chartData = [
            { label: '中等生逆袭成功率', value: 98, unit: '%' },
            { label: '学员上岸211/985', value: 200, unit: '+' },
            { label: '深耕教育年限', value: 30, unit: '年' }
        ];

        // 2. 核心优势配置
        const featureData = [
            { icon: '🎯', title: '精准定位', desc: '专攻中等生逆袭，直击痛点' },
            { icon: '🧠', title: '独家方法论', desc: '30年经验沉淀，自成体系' },
            { icon: '📈', title: '结果导向', desc: '98%成功率，拒绝无效努力' }
        ];

        // 3. ⭐ 爸爸新增的精英培养项目 ⭐
        const serviceData = [
            { 
                icon: '🚀', 
                title: '下等生逆袭上等生', 
                desc: '打破常规，<span class="service-highlight">不放弃任何一个孩子</span>，通过系统化教学体系，让基础薄弱的学生实现跨越式逆袭。' 
            },
            { 
                icon: '👨‍🏫', 
                title: '普通教师变高级教师', 
                desc: '重磅启动：<span class="service-highlight">2026年10月正式启动</span>，针对各初中、高中学校普通教师，提供定制化培养方案，助其晋升高级教师。' 
            },
            { 
                icon: '🏆', 
                title: '学校高考突破计划', 
                desc: '深入各中学校培训师生，<span class="service-highlight">普通高中突破30名左右上岸600分以上，重点高中突破60-80名以上</span>，实现高考成绩质的飞跃。' 
            }
        ];

        // 4. ⭐ 视频配置（直接填入你发我的抖音链接） ⭐
        const videoData = [
            { 
                title: "真实案例分享 01", 
                desc: "点击卡片，直接跳转到抖音App观看高清视频。", 
                videoUrl: "https://v.douyin.com/FJ_s416842A/:6pmeoQ:/01/17y@g.Ok" 
            },
            { 
                title: "真实案例分享 02", 
                desc: "点击卡片，直接跳转到抖音App观看高清视频。", 
                videoUrl: "https://v.douyin.com/q9bhkBunlmE/Wzg:/01/05:8pmN@w.FH" 
            },
            { 
                title: "更多实战经验分享", 
                desc: "（预留位置，后续可添加更多视频）", 
                videoUrl: "https://v.douyin.com/q9bhkBunlmE/Wzg:/01/05:8pmN@w.FH" 
            }
        ];

        // ============================================================
        // 核心逻辑：生成内容 + 动效监听
        // ============================================================
        function renderApp() {
            // 1. 渲染柱状图
            const chartContainer = document.getElementById('chartContainer');
            chartContainer.innerHTML = '';
            const maxVal = Math.max(...chartData.map(d => d.value));
            chartData.forEach((item, index) => {
                let visualHeight = (item.value / maxVal) * 80; 
                visualHeight = Math.max(visualHeight, 20); 
                const delay = index * 0.3 + 0.2; 
                const wrapper = document.createElement('div');
                wrapper.className = 'bar-wrapper';
                wrapper.innerHTML = `
                    <div class="bar-num" style="transition-delay: ${delay + 0.8}s">${item.value}${item.unit}</div>
                    <div class="bar" data-height="${visualHeight}%" style="transition-delay: ${delay}s"></div>
                    <div class="bar-label">${item.label}</div>
                `;
                chartContainer.appendChild(wrapper);
            });

            // 2. 渲染核心优势卡片
            const featureGrid = document.getElementById('featureGrid');
            featureData.forEach(feat => {
                const card = document.createElement('div');
                card.className = 'feature-card';
                card.innerHTML = `
                    <div class="feature-icon">${feat.icon}</div>
                    <h3 class="feature-title">${feat.title}</h3>
                    <p class="feature-desc">${feat.desc}</p>
                `;
                featureGrid.appendChild(card);
            });

            // 3. 渲染精英培养模块
            const serviceGrid = document.getElementById('serviceGrid');
            serviceData.forEach(srv => {
                const card = document.createElement('div');
                card.className = 'service-card';
                card.innerHTML = `
                    <div class="service-icon">${srv.icon}</div>
                    <div class="service-content">
                        <h4>${srv.title}</h4>
                        <p>${srv.desc}</p>
                    </div>
                `;
                serviceGrid.appendChild(card);
            });

            // 4. 渲染视频卡片（跳转模式）
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = ''; 
            videoData.forEach((video) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                
                // 点击整张卡片跳转
                card.onclick = () => {
                    window.open(video.videoUrl, '_blank');
                };

                // 显示的内容（带播放按钮和提示）
                card.innerHTML = `
                    <div class="video-placeholder">
                        <div class="play-icon">▶</div>
                        <span style="font-weight: 500; font-size: 0.95rem;">点击前往抖音观看</span>
                    </div>
                    <div class="video-info">
                        <h3>${video.title}</h3>
                        <p>${video.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });

            // 5. 滚动动画监听器
            const observerOptions = { root: null, rootMargin: '0px 0px -50px 0px', threshold: 0.1 };
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('show');
                        if (entry.target.id === 'heroCard') {
                            setTimeout(() => {
                                document.querySelectorAll('.bar').forEach(bar => {
                                    bar.style.height = bar.getAttribute('data-height');
                                });
                                document.querySelectorAll('.bar-num').forEach(num => {
                                    num.classList.add('show');
                                });
                            }, 300); 
                        }
                        obs.unobserve(entry.target); 
                    }
                });
            }, observerOptions);

            const elementsToAnimate = document.querySelectorAll('#heroCard, .feature-card, .service-card, .video-card');
            elementsToAnimate.forEach(el => observer.observe(el));
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
