<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黔岭985领航工作室 - 个人展示</title>
    <style>
        /* --- 全局深色高级背景 --- */
        :root {
            --primary: #0f172a;      /* 深邃夜蓝 */
            --accent: #e11d48;       /* 亮眼红 */
            --text-main: #1e293b;
            --text-light: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }

        body {
            /* 深色渐变背景，告别纯白 */
            background: linear-gradient(160deg, #eef2f6 0%, #dbe4ee 40%, #c8d4e3 100%);
            min-height: 100vh;
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

        /* --- 顶部人物卡片区 --- */
        .hero {
            padding: 60px 0 20px;
        }

        .hero-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            /* 初始状态 */
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .hero-content.show {
            opacity: 1;
            transform: translateY(0);
        }

        .avatar-box {
            width: 180px; height: 180px;
            margin: 0 auto 25px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #c8d4e3, #ffffff);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .avatar-box img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .hero-title {
            font-size: 2rem;
            color: var(--primary);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .hero-sub {
            font-size: 1.05rem;
            color: var(--text-light);
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* --- 核心数据横排卡片（替代原来竖着的白块） --- */
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 200px;
            background: #ffffff;
            padding: 25px 15px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 35px rgba(15, 23, 42, 0.12);
        }

        .stat-num {
            display: block;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .stat-label {
            font-size: 0.95rem;
            color: var(--text-light);
            font-weight: 500;
        }

        /* --- 视频展示区 --- */
        .video-section { padding: 60px 0; }

        .section-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 40px;
            position: relative;
        }

        .section-title::after {
            content: ''; display: block;
            width: 50px; height: 4px;
            background: var(--accent);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* --- 视频卡片（带顺滑动效） --- */
        .video-card {
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.04);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease, box-shadow 0.4s ease;
            
            /* 初始状态：透明且下移，制造出“滑入”的视觉 */
            opacity: 0;
            transform: translateY(60px); 
        }

        /* 当元素出现在视口内，加上这个类，触发动画 */
        .video-card.show {
            opacity: 1;
            transform: translateY(0); /* 归位 */
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 45px rgba(15, 23, 42, 0.1);
        }

        .video-placeholder {
            width: 100%; aspect-ratio: 16 / 9;
            background: #f1f5f9;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #94a3b8;
            border-bottom: 1px solid #e2e8f0;
        }

        .play-icon {
            font-size: 40px;
            color: var(--accent);
            margin-bottom: 8px;
            opacity: 0.8;
            transition: transform 0.3s, opacity 0.3s;
        }

        .video-card:hover .play-icon { transform: scale(1.15); opacity: 1; }

        .video-info { padding: 22px; }
        .video-info h3 { font-size: 1.15rem; color: var(--primary); margin-bottom: 8px; font-weight: 700; }
        .video-info p { font-size: 0.9rem; color: var(--text-light); }

        /* --- 底部 --- */
        footer {
            background: var(--primary);
            color: #cbd5e1;
            text-align: center;
            padding: 35px 0;
            margin-top: 40px;
            border-radius: 30px 30px 0 0;
            font-size: 0.9rem;
        }

        /* --- 手机端适配 --- */
        @media (max-width: 768px) {
            .hero-content { padding: 30px 20px; border-radius: 20px; }
            .avatar-box { width: 140px; height: 140px; }
            .hero-title { font-size: 1.7rem; }
            .stats-row { flex-direction: column; gap: 12px; }
            .stat-card { min-width: 100%; padding: 18px; }
            .stat-num { font-size: 1.9rem; }
            .video-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部人物卡片 -->
        <section class="hero">
            <div class="hero-content" id="heroCard">
                <div class="avatar-box">
                    <!-- ⚠️ 保持你的图片名为 avatar.jpg -->
                    <img src="avatar.jpg" alt="黔岭985领航工作室创始人">
                </div>
                <h1 class="hero-title">黔岭985领航工作室</h1>
                <p class="hero-sub">企业、教育集团策划 | 30年教育教学经验</p>
                
                <div class="stats-row">
                    <div class="stat-card">
                        <span class="stat-num">98%</span>
                        <span class="stat-label">中等生变尖子生成功率</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-num">200+</span>
                        <span class="stat-label">一对一上岸211/985</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-num">30年</span>
                        <span class="stat-label">深耕教育教学经验</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 视频展示区 -->
        <section class="video-section">
            <h2 class="section-title">教学成果与分享</h2>
            <div class="video-grid" id="videoGrid">
                <!-- JS 自动生成卡片 -->
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 黔岭985领航工作室 | 专注教育，领航未来</p>
    </footer>

    <script>
        // ============================================================
        // 视频配置区（填入电脑版抖音或B站的嵌入代码链接）
        // ============================================================
        const videoData = [
            {
                title: "中等生逆袭985的真实案例",
                desc: "分享一位普通中学生如何通过三年规划成功上岸985大学的心路历程。",
                videoUrl: "" 
            },
            {
                title: "教育集团策划实战分享",
                desc: "30年经验总结：如何为教育集团做顶层设计与战略规划。",
                videoUrl: ""
            },
            {
                title: "家长课堂：如何激发孩子内驱力",
                desc: "针对中小学生，家长如何配合学校做好家庭教育。",
                videoUrl: ""
            }
        ];

        // ============================================================
        // 核心逻辑：生成卡片 + 滑动监听（带顺滑弹性效果）
        // ============================================================
        function renderApp() {
            const grid = document.getElementById('videoGrid');
            
            // 1. 生成视频卡片
            grid.innerHTML = ''; 
            videoData.forEach((video) => {
                const card = document.createElement('div');
                card.className = 'video-card';

                let mediaContent = '';
                if (video.videoUrl && video.videoUrl.trim() !== '') {
                    mediaContent = `
                        <div style="width:100%; aspect-ratio:16/9;">
                            <iframe src="${video.videoUrl}" style="width:100%; height:100%;" frameborder="0" allowfullscreen></iframe>
                        </div>
                    `;
                } else {
                    mediaContent = `
                        <div class="video-placeholder">
                            <div class="play-icon">▶</div>
                            <span>视频准备中</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${mediaContent}
                    <div class="video-info">
                        <h3>${video.title}</h3>
                        <p>${video.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });

            // 2. 设置滚动动画监听器
            const observerOptions = {
                root: null, // 相对于视口
                rootMargin: '0px 0px -50px 0px', // 提前50px触发，更顺滑
                threshold: 0.1 // 只要出现10%就触发
            };

            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // 稍微加一点点延迟，让卡片显得有“弹”出来的感觉
                        entry.target.classList.add('show');
                        obs.unobserve(entry.target); // 动画触发后取消监听，避免重复出现
                    }
                });
            }, observerOptions);

            // 把顶部卡片和所有视频卡片加入监听
            const elementsToAnimate = document.querySelectorAll('#heroCard, .video-card');
            elementsToAnimate.forEach(el => observer.observe(el));
        }

        // 页面加载完毕执行
        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
